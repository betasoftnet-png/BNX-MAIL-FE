<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <title>BNXmail</title>
  <link rel="icon" type="image/jpeg" href="/bnx-remove-2.png" />

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:0;padding:0;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">
        <img src="/bnx-remove-2.png" alt="BNXmail" style="width:48px;height:48px;object-fit:contain;" onerror="this.style.display='none'" />
        <span style="font-size:24px;font-weight:700;color:#0f172a;letter-spacing:-0.5px;">BNXmail</span>
      </div>
      <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#135bec;border-radius:50%;animation:bnx-spin 0.8s linear infinite;"></div>
    </div>
  </div>
  <script>
    // Automatic recovery from transient HTTP/2 stream drops and dynamic chunk load failures
    window.addEventListener('vite:preloadError', (event) => {
      console.warn('Vite preload error detected, reloading to recover:', event);
      const reloadKey = 'bnx_chunk_reload';
      const lastReload = sessionStorage.getItem(reloadKey);
      const now = Date.now();
      if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
        sessionStorage.setItem(reloadKey, String(now));
        window.location.reload();
      }
    });

    window.addEventListener('error', (event) => {
      const isChunkError = event?.message && (
        event.message.includes('Failed to fetch dynamically imported module') ||
        event.message.includes('Loading chunk') ||
        event.message.includes('ERR_HTTP2_PING_FAILED')
      );
      const isScriptTagError = event?.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK');
      if (isChunkError || isScriptTagError) {
        const reloadKey = 'bnx_asset_reload';
        const lastReload = sessionStorage.getItem(reloadKey);
        const now = Date.now();
        if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
          sessionStorage.setItem(reloadKey, String(now));
          window.location.reload();
        }
      }
    }, true);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
