<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>BNXmail</title>
  <link rel="icon" type="image/jpeg" href="/bnx-remove-2.png" />

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:0;padding:0;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">
        <img src="/bnx-remove-2.png" alt="BNXmail" style="width:48px;height:48px;object-fit:contain;" onerror="this.style.display='none'" />
        <span style="font-size:24px;font-weight:700;color:#0f172a;letter-spacing:-0.5px;">BNXmail</span>
      </div>
      <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#135bec;border-radius:50%;animation:bnx-spin 0.8s linear infinite;"></div>
      <style>
        @keyframes bnx-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
